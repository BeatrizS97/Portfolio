<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Quem está assistindo?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>

<body>
    <!-- Cabeçalho fixo com navegação -->
    <header class="navbar">
        <!-- Logo da marca -->
        <h1 class="logo">B.S</h1>

        <!-- Botão para abrir menu mobile -->
        <button class="hamburger" id="hamburger" aria-label="Menu de navegação" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Menu de navegação principal -->
        <nav id="nav-menu">
            <a href="#hero">Início</a>
            <a href="#habilidades-tecnicas">Habilidades Técnicas</a>
            <a href="#soft-skills">Soft Skills</a>
            <a href="#cursos">Cursos e Certificações</a>
            <a href="#atividades">Atividades Complementares</a>
            <a href="#idiomas">Idiomas</a>
            <a href="#publicacoes">Publicações Científicas</a>
            <a href="#projetos">Projetos no GitHub</a>
            <a href="#experiencia-internacional">Experiência Internacional</a>
        </nav>
    </header>

    <!-- Conteúdo principal: tela de seleção de perfil -->
    <main class="profile-screen" aria-label="Seleção de Perfil">
        <h2 class="text-4xl md:text-5xl font-bold mb-4">Quem está assistindo?</h2>

        <!-- Grid com os perfis disponíveis -->
        <section class="profile-grid">
            <!-- Card de perfil individual -->
            <article class="profile-card" style="background-image: url('../images/bibia.jpg');"
                onclick="window.location.href='main.html'" role="button" tabindex="0" aria-label="Perfil Beatriz">
                <span>Beatriz ♥</span>
            </article>
        </section>

        <!-- Botão para gerenciar perfis -->
        <button class="manage-profiles" onclick="alert('Gerenciar perfis ainda não implementado.')"
            aria-label="Gerenciar Perfis">Gerenciar perfis</button>
    </main>

    <!-- Script para interatividade do menu -->
    <script src="../js/perfil.js"></script>
</body>

</html>
