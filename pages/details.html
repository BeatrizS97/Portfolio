<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Detalhes de Cursos e Certificações</title>
    <link rel="icon" type="image/svg+xml" href="../images/favicon-netflix-b.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/details.css">
</head>

<body>
    <!-- Cabeçalho fixo com navegação -->
    <header class="navbar">
        <!-- Logo da marca -->
        <h1 class="logo">B.S</h1>

        <!-- Botão para abrir menu mobile -->
        <button class="hamburger" id="hamburger" aria-label="Menu de navegação" aria-expanded="false">
            <i class="fas fa-bars"></i>
        </button>

        <!-- Menu de navegação principal -->
        <nav id="nav-menu">
            <a href="main.html#hero">Início</a>
            <a href="main.html#habilidades-tecnicas">Habilidades Técnicas</a>
            <a href="main.html#soft-skills">Soft Skills</a>
            <a href="main.html#cursos">Cursos e Certificações</a>
            <a href="main.html#atividades">Atividades Complementares</a>
            <a href="main.html#idiomas">Idiomas</a>
            <a href="main.html#publicacoes">Publicações Científicas</a>
            <a href="main.html#projetos">Projetos no GitHub</a>
            <a href="main.html#experiencia-internacional">Experiência Internacional</a>
        </nav>

        <!-- Espaço reservado para elementos da direita -->
        <aside class="navbar-right" aria-label="Menu do usuário"></aside>
    </header>

    <!-- Conteúdo principal: detalhes do curso/certificação -->
    <main class="details-hero" aria-label="Detalhes do Curso/Certificação">
        <!-- Container dinâmico preenchido via JavaScript -->
        <article class="details-flex" id="detailsContainer">
            <!-- Conteúdo será injetado dinamicamente -->
        </article>
    </main>
    
    <!-- Script para carregar os detalhes e controlar o menu -->
    <script src="../js/details.js"></script>
</body>

</html>
